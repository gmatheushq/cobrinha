name: Treino coletivo

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treino-coletivo
  cancel-in-progress: false

jobs:
  treinar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar partidas humanas, treinar e validar
        env:
          COBRINHA_URL: ${{ secrets.COBRINHA_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        run: python atualizar_modelo.py

      - name: Publicar modelo aprovado
        run: |
          git config user.name "treino-coletivo"
          git config user.email "treino-coletivo@users.noreply.github.com"

          git add docs/modelo.json modelos/
          if [ -f relatorio_treino.json ]; then
            git add relatorio_treino.json
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Atualiza IA com partidas humanas validadas"
            git push
          fi
